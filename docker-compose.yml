services:
  db:
    image: postgres:16-alpine
    container_name: reactor-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    image: axllent/mailpit:latest
    container_name: reactor-mail
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Bandeja web: http://localhost:8025

  # Descomentar cuando exista backend/Dockerfile
  # backend:
  #   build: ./backend
  #   container_name: reactor-backend
